# DB_PASSWORD, LDAP_ENC_KEY, LDAP_ENC_SALT gibi yerel sirlar artik IntelliJ Run
# Configuration yerine backend modulunun kokundeki secrets.properties dosyasindan
# okunuyor (pom.xml ile ayni klasor). O dosya git'e eklenmez (.gitignore).
# "optional:" sayesinde dosya yoksa (ornegin baska bir makinede) uygulama yine
# calisir, sadece env var fallback'lerine (asagidaki ${...:default}) doner.

spring.config.import=optional:file:./secrets.properties

server.port=4000

# Android paket/activity: Panel'e (Ayarlar) hic girilmemis, sifirdan kurulan
# bir ortamda kullanilacak ilk deger olarak burada kaliyor. Panel'den bir kere
# ayarlandiktan sonra artik buradan degil veritabanindan okunuyor.

android.app-package=com.pozitron.hepsiburada
android.app-activity=com.hepsiburada.ui.startup.SplashActivity

# --- Oracle Database (LDAP ayarlari + kullanici tablolari) ---
# Sifreyi buraya yazma; calistirmadan once terminalde export et:
#   export DB_PASSWORD='Bk.25122512'
# URL varsayilani "localhost:1521/FREEPDB1" -- veritabanin baska bir makinede/
# portta/PDB adinda ise, dosyayi degistirip yeniden build etmek yerine sadece
# export DB_URL='jdbc:oracle:thin:@baska-host:1521/BASKA_PDB' yeterli.

spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
spring.datasource.username=${DB_USERNAME:system}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.hibernate.ddl-auto=update
# Hibernate 6, dialect'i JDBC baglantisindan otomatik tespit eder; elle
# org.hibernate.dialect.OracleDialect yazmaya gerek yok (Hibernate 5'teki
# Oracle12cDialect gibi versiyona ozel siniflar Hibernate 6'da kaldirildi).
spring.jpa.open-in-view=false

# LDAP manager sifresi gibi geri cozulebilir sirlari saklamak icin AES anahtari.
# Asagidakiler sadece yerel gelistirme icin varsayilan degerdir - gercek/sirket
# LDAP'i baglanmadan once mutlaka export ile kendi degerlerinle degistir:
#   export LDAP_ENC_KEY='...'
#   export LDAP_ENC_SALT='...' (hex, 16 karakter)

ldap.encryption.key=${LDAP_ENC_KEY:change-me-in-prod}
ldap.encryption.salt=${LDAP_ENC_SALT:5a1e010203040506}
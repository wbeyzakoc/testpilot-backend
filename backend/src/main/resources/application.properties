# DB_PASSWORD, LDAP_ENC_KEY, LDAP_ENC_SALT gibi yerel sırlar artık IntelliJ Run/
# terminal konfigurasyonu yerine backend modulünün kökündeki secrets.properties
# dosyasından okunur. Dışarıdaki home dizinindeki dosya da desteklenir.
# "optional:" sayesinde dosya yoksa başka bir makinede uygulama yine çalışmaya
# devam eder; sadece env var fallback'lerine (${...:default}) düşer.

spring.config.import=\
  optional:file:${user.dir}/secrets.properties,\
  optional:file:${user.dir}/../secrets.properties,\
  optional:file:${user.home}/secrets.properties
server.port=8080

# SSL/TLS certificate handling for LLM API calls (OpenRouter)
# Development only - disables certificate validation for self-signed certs
# IMPORTANT: Do NOT use in production!
spring.jmx.enabled=false

# Android paket/activity: Panel'e (Ayarlar) hic girilmemis, sifirdan kurulan
# bir ortamda kullanilacak ilk deger olarak burada kaliyor. Panel'den bir kere
# ayarlandiktan sonra artik buradan degil veritabanindan okunuyor.

android.app-package=com.pozitron.hepsiburada
android.app-activity=com.hepsiburada.ui.startup.SplashActivity

# --- Oracle Database (LDAP ayarlari + kullanici tablolari) ---

#   export DB_PASSWORD='TestPilotLocal2024'
# URL varsayilani "localhost:1521/FREEPDB1" -- veritabanin baska bir makinede/
# portta/PDB adinda ise, dosyayi degistirip yeniden build etmek yerine sadece
# export DB_URL='jdbc:oracle:thin:@baska-host:1521/BASKA_PDB' yeterli.

spring.datasource.hikari.data-source-properties.oracle.jdbc.timezoneAsRegion=false
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
spring.datasource.username=${DB_USERNAME:testpilot}
spring.datasource.password=${DB_PASSWORD:TestPilotLocal2024}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
# DDL auto update - Hibernate otomatik tabloları oluşturacak/güncelleyecek
# İlk kurulumdan sonra 'none' veya 'validate' yapılabilir (DB'yi korumak için)
spring.jpa.hibernate.ddl-auto=update
# Hibernate 6, dialect'i JDBC baglantisindan otomatik tespit eder; elle
# org.hibernate.dialect.OracleDialect yazmaya gerek yok (Hibernate 5'teki
# Oracle12cDialect gibi versiyona ozel siniflar Hibernate 6'da kaldirildi).
spring.jpa.open-in-view=false

# LDAP manager sifresi gibi geri cozulebilir sirlari saklamak icin AES anahtari.
# Asagidakiler sadece yerel gelistirme icin varsayilan degerdir - gercek/sirket
# LDAP'i baglanmadan once mutlaka export ile kendi degerlerinle degistir:
#   export LDAP_ENC_KEY='...'
#   export LDAP_ENC_SALT='...' (hex, 16 karakter)

ldap.encryption.key=${LDAP_ENC_KEY:change-me-in-prod}
ldap.encryption.salt=${LDAP_ENC_SALT:5a1e010203040506}
# LDAP giris denemesi basarisiz olunca gercek nedeni (baglanti hatasi, yanlis
# manager sifresi, kullanici bulunamadi vb.) login ekraninda gorebilmek icin --
# bu olmadan Spring, hata govdesindeki "message" alanini varsayilan olarak
# gizliyor (guvenlik icin), biz kendi LDAP hatalarimizi bilerek gosteriyoruz.
server.error.include-message=always

# Disable favicon.ico auto-configuration to prevent NoResourceFoundException
spring.mvc.favicon.enabled=false
